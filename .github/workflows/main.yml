name: secrets Demo  

on:
  push:
    branches: [main]

jobs:
  show-secret: 
    runs-on: ubuntu-latest

    steps: 
      - name: Print the secret message
        env:
          MY_SECRET: ${{ secrets.SECRET_MESSAGE }}

        run: echo "The secret says:$MY_SECRET"  
  matrix-test:
    runs-on: ubuntu-latest
    strategy:
      matrix: 
        python-version: ['3.9','3.10','3.11'] 

    steps:
      - name: show which python version 
        run: echo "Running on python ${{matrix.python-version }}"  

      - name: Set up python ${{matrix.python-version}} 
        uses: actions/setup-python@v5

        with:
          python-version: ${{matrix.python-version}}
      - name: confirm python version
        run: pyton --version
        

        